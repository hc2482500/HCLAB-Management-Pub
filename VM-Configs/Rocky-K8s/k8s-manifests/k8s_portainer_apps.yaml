- apiVersion: v1
  data:
    app.py: |
      from flask import Flask, render_template, jsonify
      import mysql.connector
      import os

      app = Flask(__name__)

      db_config = {
          'user': 'root',
          'password': 'password-mariadb', # <--- METTI LA TUA PASSWORD REALE QUI
          'host': 'mariadb-service',    # Nome del servizio MariaDB in K8s
          'port': 3306,
          'database': 'laboratorio'
      }

      @app.route('/')
      def index():
          return render_template('index.html')

      @app.route('/api/dati')
      def get_data():
          try:
              conn = mysql.connector.connect(**db_config)
              cursor = conn.cursor(dictionary=True)
              cursor.execute("SELECT sensore_nome, valore, DATE_FORMAT(data_invio, '%H:%i:%s') as data_invio FROM misurazioni ORDER BY id DESC LIMIT 20")
              rows = cursor.fetchall()
              cursor.close()
              conn.close()
              return jsonify(rows[::-1])
          except Exception as e:
              return jsonify({"error": str(e)})

      if __name__ == '__main__':
          app.run(host='0.0.0.0', port=5000)
    index.html: "<!DOCTYPE html>\n<html>\n<head>\n    <title>K8s Dashboard</title>\n
      \   <script src=\"https://cdn.jsdelivr.net/npm/chart.js\"></script>\n    <style>\n
      \       body { font-family: sans-serif; text-align: center; background: #eceff1;
      }\n        .container { width: 85%; margin: 30px auto; background: white; padding:
      20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }\n    </style>\n</head>\n<body>\n
      \   <div class=\"container\">\n        <h1>\U0001F680 Cluster Live Monitor</h1>\n
      \       <canvas id=\"myChart\"></canvas>\n    </div>\n    <script>\n        const
      ctx = document.getElementById('myChart').getContext('2d');\n        const myChart
      = new Chart(ctx, {\n            type: 'line',\n            data: { labels: [],
      datasets: [{ label: 'Temp CPU (°C)', data: [], borderColor: '#00bcd4', backgroundColor:
      'rgba(0, 188, 212, 0.1)', fill: true, tension: 0.3 }] }\n        });\n        function
      updateData() {\n            fetch('/api/dati').then(res => res.json()).then(data
      => {\n                myChart.data.labels = data.map(row => row.data_invio);\n
      \               myChart.data.datasets[0].data = data.map(row => row.valore);\n
      \               myChart.update();\n            });\n        }\n        setInterval(updateData,
      3000);\n        updateData();\n    </script>\n</body>\n</html>\n"
    index.php: "<?php\n$servername = \"mariadb-service\";\n$username = \"root\";\n$password
      = getenv('DATABASE_PWD'); \n$dbname = \"laboratorio\";\n\n$conn = new mysqli($servername,
      $username, $password, $dbname);\nif ($conn->connect_error) { die(\"Connessione
      fallita: \" . $conn->connect_error); }\n\n// Query corretta basata sulla tua
      tabella\n$sql = \"SELECT id, nome, sistema_operativo, ram_gb FROM server\";\n$result
      = $conn->query($sql);\n\necho \"<html><body style='font-family:sans-serif; padding:20px;'>\";\necho
      \"<h1>\U0001F5A5️ Inventario Server Laboratorio</h1>\";\necho \"<table border='1'
      cellpadding='10' style='border-collapse:collapse; width:100%; text-align:left;'>\";\necho
      \"<tr style='background:#007bff; color:white;'><th>ID</th><th>Nome Server</th><th>Sistema
      Operativo</th><th>RAM (GB)</th></tr>\";\n\nif ($result && $result->num_rows
      > 0) {\n  while($row = $result->fetch_assoc()) {\n    echo \"<tr>\";\n    echo
      \"<td>\".$row[\"id\"].\"</td>\";\n    echo \"<td><strong>\".$row[\"nome\"].\"</strong></td>\";\n
      \   echo \"<td>\".$row[\"sistema_operativo\"].\"</td>\";\n    echo \"<td>\".$row[\"ram_gb\"].\"
      GB</td>\";\n    echo \"</tr>\";\n  }\n} else { \n  echo \"<tr><td colspan='4'>Nessun
      dato trovato nella tabella 'server'</td></tr>\"; \n}\necho \"</table>\";\necho
      \"<p style='margin-top:20px; color:#666;'>Dati estratti in tempo reale dal database
      MariaDB.</p>\";\necho \"</body></html>\";\n$conn->close();\n?>"
