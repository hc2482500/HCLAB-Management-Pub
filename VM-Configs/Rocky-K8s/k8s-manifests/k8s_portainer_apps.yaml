  kind: ConfigMap
  metadata:
    annotations:
      meta.helm.sh/release-name: prometheus
      meta.helm.sh/release-namespace: monitoring
    creationTimestamp: "2026-04-23T06:43:12Z"
    labels:
      app: kube-prometheus-stack-grafana
