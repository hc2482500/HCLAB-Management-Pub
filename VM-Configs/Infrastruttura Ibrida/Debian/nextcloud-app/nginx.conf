events { 
    worker_connections 1024; 
}

http {
    # Ottimizzazioni per il caricamento di file grandi (Globali)
    client_max_body_size 10G;
    fastcgi_buffers 64 4K;

    # 1. DEFINIZIONE DEI BACKEND (Usiamo i nomi dei SERVIZI del docker-compose)
    upstream nextcloud_backend {
        server app:80; # <- CORRETTO: Prima era nextcloud_app
    }

    upstream vaultwarden_backend {
        server vaultwarden:80; 
    }

    # 2. BLOCCO SERVER PER NEXTCLOUD
    server {
        listen 80;
        server_name cloud.hcdebian02.local;

        location / {
            proxy_pass http://nextcloud_backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_redirect off;
            proxy_buffering off;
            proxy_read_timeout 1200s;
        }
    }

    # 3. BLOCCO SERVER PER VAULTWARDEN
    server {
        listen 80;
        server_name passwords.hcdebian02.local;

        location / {
            proxy_pass http://vaultwarden_backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}