services:
  db:
    image: postgres:16-alpine
    container_name: nextcloud_db
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=UnaPasswordSicuraSceglilaTu
    networks:
      - lab_net

  app:
    image: nextcloud:latest
    container_name: nextcloud_app
    restart: always
    volumes:
      - nextcloud_data:/var/www/html
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=UnaPasswordSicuraSceglilaTu
    depends_on:
      - db
    networks:
      - lab_net

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    # LA RIGA PORTS È STATA RIMOSTA: Vaultwarden ora è isolato nella rete interna
    # L'ambiente ROCKET_TLS è stato rimosso per parlare in HTTP standard con Nginx
    volumes:
      - vw_data:/data
    networks:
      - lab_net

  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
      - SERVERURL=ip-server-dc
      - SERVERPORT=51820
      - PEERS=utest01,utest03
      - PEERDNS=ip-serverd-dc
      - ALLOWEDIPS=0.0.0.0/0
    volumes:
      - ./wireguard-config:/config
      - /lib/modules:/lib/modules
    ports:
      - 51820:51820/udp
    restart: always

  # IL REVERSE PROXY: Ora prende ufficialmente la porta 80 standard
  reverse-proxy:
    image: nginx:alpine
    container_name: reverse_proxy
    restart: always
    ports:
      - "80:80" # Mappatura da vero server di produzione
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - vaultwarden
    networks:
      - lab_net

volumes:
  db_data:
  nextcloud_data:
  vw_data:

networks:
  lab_net:
    driver: bridge