---
- name: Setup LXD su Rocky Linux 10
  hosts: servers
  become: yes
  tasks:
    - name: Installazione repository EPEL
      dnf:
        name: epel-release
        state: present

    - name: Installazione snapd
      dnf:
        name: snapd
        state: present

    - name: Abilitazione snapd socket
      systemd:
        name: snapd.socket
        enabled: yes
        state: started

    - name: Creazione link simbolico per snap
      file:
        src: /var/lib/snapd/snap
        dest: /snap
        state: link

    - name: Installazione LXD via Snap
      snap:
        name: lxd
        state: present

    - name: Inizializzazione automatica LXD (Idempotente)
      command: /snap/bin/lxd init --auto
      args:
        creates: /var/snap/lxd/common/lxd/unix.socket