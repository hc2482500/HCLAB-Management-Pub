---
# ATTO 0: Trova il container e registralo in memoria
- name: Pre-Setup - Connessione al Container
  hosts: servers
  become: yes
  tasks:
    - name: Registra il container in memoria
      add_host:
        name: web-server-aziendale
        ansible_connection: lxd
        ansible_user: root
        ansible_remote_tmp: /tmp

# ATTO 1: Deploy del sito PHP
- name: Deploy Portale Intranet Dinamico (PHP + FreeIPA LDAP)
  hosts: web-server-aziendale
  become: yes
  tasks:
    - name: 1. Installa PHP e il modulo LDAP
      ansible.builtin.apt:
        name: 
          - php-fpm
          - php-ldap
        state: present
        update_cache: yes

    - name: 2. Configura Nginx per leggere il PHP
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/default
        content: |
          server {
              listen 80 default_server;
              root /var/www/html;
              index index.php index.html index.htm;
              server_name _;
              location / { try_files $uri $uri/ =404; }
              location ~ \.php$ {
                  include snippets/fastcgi-php.conf;
                  fastcgi_pass unix:/run/php/php8.1-fpm.sock;
              }
          }
      notify: Riavvia Nginx

    - name: 3. Rimuovi il vecchio file HTML statico
      ansible.builtin.file:
        path: /var/www/html/index.html
        state: absent

    - name: 4. Inietta l'App Intranet in PHP (RBAC)
      ansible.builtin.copy:
        dest: /var/www/html/index.php
        content: |
          <?php
          session_start();
          $error = '';
          
          if (isset($_GET['logout'])) { session_destroy(); header("Location: index.php"); exit; }

          if ($_SERVER['REQUEST_METHOD'] == 'POST') {
              $user = $_POST['username'];
              $pass = $_POST['password'];
              $ldap_host = "ldap://ip-host"; 
              $ldap_dn = "uid=$user,cn=users,cn=accounts,dc=hcro01,dc=lan"; 
              
              $conn = @ldap_connect($ldap_host);
              ldap_set_option($conn, LDAP_OPT_PROTOCOL_VERSION, 3);
              
              if (@ldap_bind($conn, $ldap_dn, $pass)) {
                  $_SESSION['user'] = $user;
                  $search = @ldap_search($conn, "cn=groups,cn=accounts,dc=hcro01,dc=lan", "(&(cn=admins)(member=$ldap_dn))");
                  $entries = @ldap_get_entries($conn, $search);
                  $_SESSION['is_admin'] = ($entries['count'] > 0);
                  header("Location: index.php"); exit;
              } else {
                  $error = "Credenziali non valide o utente non trovato.";
              }
          }
          ?>
          <!DOCTYPE html>
          <html lang="it">
          <head>
              <meta charset="UTF-8"><title>HCRO01 - Intranet</title>
              <style>
                  body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #fff; margin: 0; }
