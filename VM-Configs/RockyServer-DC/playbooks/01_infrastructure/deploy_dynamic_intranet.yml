                  header h1 { margin: 0; color: #00a8ff; }
                  .container { padding: 50px; text-align: center; }
                  .login-box { background: #1f1f1f; padding: 30px; width: 300px; margin: 0 auto; border-radius: 8px; border-top: 4px solid #00a8ff; }
                  input { width: 90%; padding: 10px; margin: 10px 0; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; }
                  button { background: #00a8ff; color: #fff; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
                  .features { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 40px; }
                  .card { background: #1f1f1f; padding: 20px; border-radius: 8px; width: 250px; border-top: 4px solid #333; text-decoration: none; color: white; transition: 0.3s; }
                  .card:hover { border-top-color: #00a8ff; transform: translateY(-5px); }
                  .card-admin { border-top-color: #ff3366; }
                  .card-admin:hover { border-top-color: #ff0044; }
                  .error { color: #ff3366; }
              </style>
          </head>
          <body>
              <header><h1>HCRO01 LAB</h1>
              <?php if(isset($_SESSION['user'])): ?>
                  <div>Benvenuto, <b><?= $_SESSION['user'] ?></b> | <a href="?logout=1" style="color:#00a8ff;">Logout</a></div>
              <?php endif; ?>
              </header>
              <div class="container">
                  <?php if(!isset($_SESSION['user'])): ?>
                      <div class="login-box">
                          <h2>Accesso Intranet</h2>
                          <?php if($error) echo "<p class='error'>$error</p>"; ?>
                          <form method="POST">
                              <input type="text" name="username" placeholder="Nome utente (es. utest01)" required>
                              <input type="password" name="password" placeholder="Password" required>
                              <button type="submit">Accedi</button>
                          </form>
                      </div>
                  <?php else: ?>
                      <h2>Dashboard dei Servizi</h2>
                      <div class="features">
                          <a href="https://vault.hcro01.lan" class="card">
                              <h3>Vaultwarden</h3><p>Gestione Password (Accesso Globale)</p>
                          </a>
                          <?php if($_SESSION['is_admin']): ?>
                              <a href="https://hcrocky.hcro01.lan" class="card card-admin">
                                  <h3>FreeIPA Console</h3><p>Gestione Utenti (Solo Admin)</p>
                              </a>
                              <a href="#" class="card card-admin">
                                  <h3>Ansible Tower</h3><p>Orchestrazione (Solo Admin)</p>
                              </a>
                          <?php endif; ?>
                      </div>
                  <?php endif; ?>
              </div>
          </body>
          </html>
        mode: '0644'

  handlers:
    - name: Riavvia Nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted