---
- name: Sblocco Definitivo Ubuntu e Pulizia Cache
  hosts: ubuntu_clients
  become: yes
  tasks:
    - name: 1. Polverizza i rimasugli di LightDM
      ansible.builtin.apt:
        name: ['lightdm', 'slick-greeter', 'lightdm-gtk-greeter', 'gnome-online-accounts']
        state: absent
        purge: yes

    - name: 2. Assicurati che GDM3 sia installato e dominante
      ansible.builtin.apt:
        name: gdm3
        state: present

    - name: 3. Pulisci la cache grafica bloccata degli utenti
      ansible.builtin.shell: |
        rm -rf /home/*/.config/dconf/user
        rm -rf /home/*/.cinnamon/
      ignore_errors: yes

    - name: 4. Riavvio brutale per applicare GDM3 e sbloccare lo schermo
      ansible.builtin.reboot:
        msg: "Ansible: Riavvio di emergenza per sblocco grafico."
        reboot_timeout: 300