version: '3.8'
services:
  app:
    image: 'docker.io/jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"    # Gestisce le richieste HTTP per i tuoi Proxy Hosts (es. portainer.local)
      - "8081:81"   # Gestisce le richieste HTTPS sicure
      - "443:443"    # La porta per accedere alla dashboard di NPM
    environment:
      DISABLE_IPV6: 'true'
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt