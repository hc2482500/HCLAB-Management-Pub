# Homepage configuration
title: "Homelab OS"
subtitle: "Centrale di Controllo hcdebian"
logo: "assets/icons/homelab-gears.png"
icon: "assets/icons/homelab-gears-favicon.png"

# --- TEMA COLORI ---
colors:
  light:
    highlight-primary: "#15803d"
    highlight-secondary: "#16a34a"
    highlight-hover: "#14532d"
    background: "#16a34a"
    card-background: "#15803d"
    text: "#ffffff"
    text-header: "#ffffff"
    text-title: "#ffffff"
    text-subtitle: "#f0fdf4"
    card-shadow: "0 8px 32px rgba(0,0,0,0.15)"
    link: "#dcfce7"
    link-hover: "#ffffff"
  dark:
    highlight-primary: "#15803d"
    highlight-secondary: "#16a34a"
    highlight-hover: "#14532d"
    background: "#16a34a"
    card-background: "#15803d"
    text: "#ffffff"
    text-header: "#ffffff"
    text-title: "#ffffff"
    text-subtitle: "#f0fdf4"
    card-shadow: "0 8px 32px rgba(0,0,0,0.15)"
    link: "#dcfce7"
    link-hover: "#ffffff"

services:
  - name: "Gestione e Monitoraggio"
    icon: "fas fa-server"
    items:
      - name: "Portainer"
        icon: "fas fa-box-open"
        subtitle: "Gestione Container Docker"
        tag: "Admin"
        url: "http://portainer.homelab.local"
        target: "_blank"
      - name: "Uptime Kuma"
        icon: "fas fa-heartbeat"
        subtitle: "Stato dei Servizi"
        tag: "Monitoraggio"
        url: "http://uptimekuma.homelab.local" #
        target: "_blank"
      - name: "Grafana"
        icon: "fas fa-chart-pie"
        subtitle: "Cruscotto Metriche"
        tag: "Monitoraggio"
        url: "http://grafana.homelab.local"
        target: "_blank"
      - name: "Prometheus"
        icon: "fas fa-database"
        subtitle: "Database Sensori"
        tag: "Backend"
        url: "http://prometheus.homelab.local"
        target: "_blank"
      - name: "Monitor di Sistema"
        icon: "fas fa-microchip"
        subtitle: "Real-time Dashboard"
        tag: "api"
        url: "http://hc0api.homelab.local"
        target: "_blank"
      - name: "Intelligenza Artificiale"
        icon: "fas fa-lightbulb"
        subtitle: "Open WebUI (Gemma)"
        tag: "AI"
        url: "http://aichat.homelab.local"
        target: "_blank"

  - name: "Utility di Sistema"
    icon: "fas fa-tools"
    items:
      - name: "Vaultwarden"
        icon: "fas fa-shield-alt"
        subtitle: "Gestore Password"
        tag: "Sicurezza"
        url: "http://vaultwarden.homelab.local" #
        target: "_blank"
      - name: "IT Tools"
        icon: "fas fa-wrench"
        subtitle: "Utility per sviluppatori"
        tag: "app"
        url: "http://it-tools.homelab.local"
        target: "_blank"
      - name: "Stirling PDF"
        icon: "fas fa-file-pdf"
        subtitle: "Gestione PDF Privata"
        tag: "office"
        url: "http://stirlingpdf.homelab.local"
        target: "_blank"
      - name: "File Browser"
        icon: "fas fa-folder-open"
        subtitle: "Gestione File 🟢"
        tag: "files"
        url: "http://filebrowser.homelab.local"
        target: "_blank"

  - name: "Simulazioni Aziendali"
    icon: "fas fa-briefcase"
    items:
      - name: "Odoo ERP"
        icon: "fas fa-building"
        subtitle: "Test Gestionale e Fatturazione"
        tag: "Business"
        url: "http://odoo.homelab.local"
        target: "_blank"