server {
    listen 443 ssl;
    server_name hc0api.homelab.local;

    ssl_certificate /etc/nginx/certs/homelab.crt;
    ssl_certificate_key /etc/nginx/certs/homelab.key;

    location / {
        # Reindirizza TUTTO al container dell'API
        proxy_pass http://hc0-api:8000; 
        
        # Header necessari per far capire all'API chi sta chiamando
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

