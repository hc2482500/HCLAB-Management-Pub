# --- 1. REINDIRIZZAMENTO AUTOMATICO HTTP -> HTTPS ---
# Ogni richiesta sulla porta 80 verrà spostata sulla porta 443
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# --- 2. CONFIGURAZIONE SSL COMUNE (Ottimizzazione) ---
# Queste righe definiscono dove Nginx troverà i tuoi certificati nel container
# e quali protocolli sicuri utilizzare.

# 1. Il tuo sito Frontend (homelab.local)
server {
    listen 443 ssl;
    server_name homelab.local;

    ssl_certificate /etc/nginx/certs/homelab.crt;
    ssl_certificate_key /etc/nginx/certs/homelab.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }
}

# 2. La tua Dashboard Homer (homer.homelab.local e IP diretto)
server {
    listen 443 ssl;
    server_name homer.homelab.local 172.16.10.230;

    ssl_certificate /etc/nginx/certs/homelab.crt;
    ssl_certificate_key /etc/nginx/certs/homelab.key;

    location / {
        proxy_pass http://homer:8080; #
    }
}

# 3. I tuoi Grafici (grafana.homelab.local)
server {
    listen 443 ssl;
    server_name grafana.homelab.local;

    ssl_certificate /etc/nginx/certs/homelab.crt;
    ssl_certificate_key /etc/nginx/certs/homelab.key;

    location / {
        proxy_set_header Host $host;
        proxy_pass http://grafana:3000; #

        # Supporto WebSockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

