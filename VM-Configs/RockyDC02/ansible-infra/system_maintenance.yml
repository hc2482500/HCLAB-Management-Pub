---
- name: Manutenzione e Aggiornamento Workstation
  hosts: workstations
  become: yes
  tasks:
    - name: Installazione del tool di monitoraggio htop
      ansible.builtin.dnf:
        name: htop
        state: present

    - name: Assicurati che il firewall aziendale permetta solo il necessario
      ansible.builtin.systemd:
        name: firewalld
        state: started
        enabled: yes

    - name: Configura il sudo passwordless per l'utente di automazione
      ansible.builtin.copy:
        content: "hcfedclient ALL=(ALL) NOPASSWD: ALL"
        dest: /etc/sudoers.d/ansible_nopasswd
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s