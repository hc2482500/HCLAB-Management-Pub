---
- name: "Atto I: Provisioning Host e Creazione Container Vaultwarden"
  hosts: localhost
  connection: local
  become: yes
  tasks:
    - name: Creazione del container LXC Ubuntu 22.04 con nesting abilitato
      community.general.lxd_container:
        name: vault-container
        state: started
        source:
          type: image
          mode: pull
          server: https://cloud-images.ubuntu.com/releases/
          protocol: simplestreams
          alias: "22.04"
        profiles: ["default"]
        config:
          boot.autostart: "true"
          security.nesting: "true"

    - name: Attesa per l'inizializzazione dell'IP del container
      ansible.builtin.pause:
        seconds: 10

    - name: Iniezione a caldo del container nell'inventario in-memory
      ansible.builtin.add_host:
        name: vault-container
        groups: vault_target

- name: "Atto II: Configurazione Interna Guest (Docker & Nginx)"
  hosts: vault_target
  connection: lxd
  vars:
    ansible_user: root
    ansible_remote_tmp: /tmp
  tasks:
    - name: Aggiornamento cache apt e installazione dipendenze
      ansible.builtin.apt:
        update_cache: yes
        name:
          - docker.io
          - nginx
        state: present

    - name: Avvio e persistenza dei servizi interni
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - docker
        - nginx

    - name: Deployment del container Docker Vaultwarden
      community.docker.docker_container:
        name: vaultwarden-server
        image: vaultwarden/server:latest
        state: started
        restart_policy: always
        ports:
          - "127.0.0.1:8080:80"
          
    - name: Assicura la presenza della directory per i dati persistenti
      ansible.builtin.file:
        path: /srv/vaultwarden
        state: directory
        mode: '0700'

    - name: Deployment del container Docker Vaultwarden con volumi attivi
      community.docker.docker_container:
        name: vaultwarden-server
        image: vaultwarden/server:latest
        state: started
        restart_policy: always
        ports:
          - "127.0.0.1:8080:80"
        volumes:
          - "/srv/vaultwarden:/data" # <-- FIX: Mappatura persistente a prova di perdita dati