<VirtualHost *:443>
    ServerName cockpit.hcro03.lan

    SSLEngine on
    SSLProxyEngine on
    
    # Forza Apache a non verificare il certificato interno su localhost
    SSLProxyVerify none
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off
    SSLProxyCheckPeerExpire off

    SSLCertificateFile /etc/httpd/certs/cockpit.crt
    SSLCertificateKeyFile /etc/httpd/certs/cockpit.key

    ProxyPreserveHost On

    # Protocollo di upgrade per i WebSocket di Cockpit (Terminale e Grafici)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(.*)           wss://127.0.0.1:9090/$1 [P,L]

    # Instradamento del traffico standard HTTPS
    ProxyPass / https://127.0.0.1:9090/
    ProxyPassReverse / https://127.0.0.1:9090/
</VirtualHost>
