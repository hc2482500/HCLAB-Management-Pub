<VirtualHost *:443>
    ServerName vault.hcro03.lan

    SSLEngine on
    SSLProxyEngine on
    
    # Direttive corrette per la Chain of Trust
    SSLCertificateFile /etc/httpd/certs/vault.crt
    SSLCertificateKeyFile /etc/httpd/certs/vault.key

    # Preserva l'header originario per evitare blocchi CSRF su Vaultwarden
    ProxyPreserveHost On

    # Instradamento verso l'IP corretto del tuo container
    ProxyPass / https://10.216.247.122:8444/
    ProxyPassReverse / https://10.216.247.122:8444/
</VirtualHost>
