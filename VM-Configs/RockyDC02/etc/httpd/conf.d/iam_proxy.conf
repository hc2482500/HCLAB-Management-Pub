<VirtualHost *:443>
    ServerName iam.hcro03.lan

    SSLEngine on
    SSLProxyEngine on
    
    SSLCertificateFile /etc/httpd/certs/iam.crt
    SSLCertificateKeyFile /etc/httpd/certs/iam.key

    ProxyPreserveHost On

    # QUESTE SONO LE DUE RIGHE FONDAMENTALI CHE MANCAVANO:
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Instradamento verso l'IP del tuo iam-container
    ProxyPass / https://10.216.247.107:8445/
    ProxyPassReverse / https://10.216.247.107:8445/
</VirtualHost>
