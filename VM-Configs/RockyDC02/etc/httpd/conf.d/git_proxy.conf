<VirtualHost *:443>
    ServerName git.hcro03.lan

    SSLEngine on
    SSLProxyEngine on
    
    SSLCertificateFile /etc/httpd/certs/git.crt
    SSLCertificateKeyFile /etc/httpd/certs/git.key

    ProxyPreserveHost On

    # Instradamento verso l'IP reale di gitea-container
    ProxyPass / https://10.216.247.26:8446/
    ProxyPassReverse / https://10.216.247.26:8446/
</VirtualHost>
