# Configurazione Servizi DDI (DNS/DHCP) leggeri per le VLAN
domain-needed
bogus-priv
domain=lab.local
expand-hosts

# --- DHCP VLAN 10 (Interfaccia eth0) ---
interface=eth0
dhcp-range=10.10.10.100,10.10.10.200,24h
dhcp-option=eth0,option:router,10.10.10.1
dhcp-option=eth0,option:dns-server,10.10.10.1

# --- DHCP VLAN 20 (Interfaccia net1) ---
interface=net1
dhcp-range=10.10.20.100,10.10.20.200,24h
dhcp-option=net1,option:router,10.10.20.1
dhcp-option=net1,option:dns-server,10.10.20.1