! Configurazione FRRouting (router-core) - OSPF, LDP, MP-BGP e VRF
!
router ospf
 ospf router-id 10.255.255.1
 network 10.0.1.0/30 area 0
 network 10.255.255.1/32 area 0
!
mpls ldp
 router-id 10.255.255.1
 address-family ipv4
  discovery transport-address 10.255.255.1
  interface eth0
  interface lo
!
router bgp 65000
 neighbor 10.255.255.2 remote-as 65000
 neighbor 10.255.255.2 update-source 10.255.255.1
 !
 address-family ipv4 vpn
  neighbor 10.255.255.2 activate
 exit-address-family
!
router bgp 65000 vrf VRF_CLIENT_A
 address-family ipv4 unicast
  rd 65000:2
  route-target vpn both 65000:1
  redistribute connected
  label vpn export auto
 exit-address-family
!